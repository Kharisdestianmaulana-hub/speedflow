name: Feature Request
description: Suggest an idea or enhancement for SpeedFlow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Community suggestions help make SpeedFlow faster, simpler, and more reliable.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I always struggle when trying to...
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capability you would like added to SpeedFlow.
      placeholder: SpeedFlow should provide an option to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions, tools, or workarounds you have considered.
      placeholder: In other tools, this is handled by...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context or Mockups
      description: Add any screenshots, mockups, or diagrams that illustrate your idea.
      placeholder: Attach any visual references or links...
    validations:
      required: false
