[package]
name = "speedflow"
version = "0.1.0"
edition = "2024"
authors = ["Kharis Destian Maulana", "SpeedFlow Contributors"]
description = "Desktop Download Manager & Accelerator"
license = "GPL-3.0-only"
repository = "https://github.com/Kharisdestianmaulana-hub/speedflow"

[dependencies]
# GUI Framework
slint = "1.18.1"

# Async Runtime
tokio = { version = "1.43", features = ["full"] }
futures-util = "0.3"

# Network
reqwest = { version = "0.12", features = ["stream", "json"] }
url = "2.5"
bytes = "1.10"

# Storage & Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization & Models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error Handling & Diagnostics
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File & Utilities
infer = "0.19"
sha2 = "0.10"
directories = "5.0"
rfd = "0.15"

[build-dependencies]
slint-build = "1.18.1"

# Lightweight build profiles to prevent target/ folder from ballooning to 8+ GB
[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = 0
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = 0
strip = "debuginfo"
incremental = false

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

